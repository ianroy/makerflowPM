<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 856" font-family="Avenir Next, Segoe UI, system-ui, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">MakerFlow PM Dart rebuild — milestone roadmap</title>
  <desc id="d">Eight sequenced milestones. Done: M1, the interactive CRUD core. Rolling now: Phase 8, the customization platform (column system, custom fields, and saved views shipped; filters and group-by next). Ready and waiting on the owner's DigitalOcean token: M0, going live with the API and web demo on one App Platform app. Then realtime and collaboration (M2), the accessibility gate (M3, CI already green, needs a human screen-reader pass), native offline/push/camera (M4), integrations and analytics (M5), and release readiness (M6).</desc>

  <rect width="920" height="856" rx="20" fill="#0e141f"/>

  <!-- header -->
  <text x="44" y="52" fill="#eaf2ff" font-size="26" font-weight="700">Dart rebuild — roadmap to v1</text>
  <text x="44" y="78" fill="#8aa0bb" font-size="14">You are here: monday-style UI · customization platform rolling (Phase 8) · full-demo DO spec ready — one doctl auth away</text>

  <!-- timeline spine -->
  <line x1="64" y1="120" x2="64" y2="778" stroke="#243044" stroke-width="2"/>

  <!-- milestone cards -->
  <g>
    <!-- M0 (ready, needs owner token) -->
    <circle cx="64" cy="142" r="7" fill="#ffbe55"/>
    <rect x="92" y="116" width="784" height="64" rx="14" fill="#1d1c1a"/>
    <rect x="92" y="116" width="4" height="64" rx="2" fill="#ffbe55"/>
    <text x="116" y="146" fill="#ffbe55" font-size="17" font-weight="700">M0 · Go live</text>
    <text x="116" y="167" fill="#a99a7e" font-size="13">API + web demo on one DO app (managed PG 17 + Valkey) — spec + runbook ready</text>
    <rect x="700" y="130" width="156" height="22" rx="11" fill="#241f16" stroke="#3a3322"/>
    <text x="778" y="145" fill="#ffd591" font-size="11" text-anchor="middle">ready · needs token</text>

    <!-- M1 (done) -->
    <circle cx="64" cy="226" r="7" fill="#21d1aa"/>
    <rect x="92" y="200" width="784" height="64" rx="14" fill="#12241f"/>
    <rect x="92" y="200" width="4" height="64" rx="2" fill="#21d1aa"/>
    <text x="116" y="230" fill="#21d1aa" font-size="17" font-weight="700">✓ M1 · Interactive core (CRUD)</text>
    <text x="116" y="251" fill="#7fae9f" font-size="13">Tasks + trash · projects + archive · ops edit paths · list view — detail screens + calendar remain</text>
    <rect x="700" y="214" width="156" height="22" rx="11" fill="#0f1f1a" stroke="#1e4438"/>
    <text x="778" y="229" fill="#9fe8d2" font-size="11" text-anchor="middle">core shipped</text>

    <!-- P8 (rolling now) -->
    <circle cx="64" cy="310" r="7" fill="#21d1aa"/>
    <rect x="92" y="284" width="784" height="64" rx="14" fill="#16202f"/>
    <rect x="92" y="284" width="4" height="64" rx="2" fill="#21d1aa"/>
    <text x="116" y="314" fill="#4db0ff" font-size="17" font-weight="700">P8 · Customization platform</text>
    <text x="116" y="335" fill="#8aa0bb" font-size="13">Column system ✓ · custom fields ✓ · saved views ✓ — filters/sort/group-by next, then subitems → automations</text>
    <rect x="700" y="298" width="156" height="22" rx="11" fill="#101826" stroke="#243044"/>
    <text x="778" y="313" fill="#cdebe2" font-size="11" text-anchor="middle">rolling · 4/11 cards</text>

    <!-- M2 -->
    <circle cx="64" cy="394" r="7" fill="#4db0ff"/>
    <rect x="92" y="368" width="784" height="64" rx="14" fill="#16202f"/>
    <rect x="92" y="368" width="4" height="64" rx="2" fill="#4db0ff"/>
    <text x="116" y="398" fill="#4db0ff" font-size="17" font-weight="700">M2 · Realtime + collaboration</text>
    <text x="116" y="419" fill="#8aa0bb" font-size="13">Live board updates · comments + activity · watchers</text>
    <rect x="724" y="382" width="132" height="22" rx="11" fill="#101826" stroke="#243044"/>
    <text x="790" y="397" fill="#bcd6f5" font-size="11" text-anchor="middle">~1 wk · infra ready</text>

    <!-- M3 -->
    <circle cx="64" cy="478" r="7" fill="#ffbe55"/>
    <rect x="92" y="452" width="784" height="64" rx="14" fill="#1d1c1a"/>
    <rect x="92" y="452" width="4" height="64" rx="2" fill="#ffbe55"/>
    <text x="116" y="482" fill="#ffbe55" font-size="17" font-weight="700">M3 · A11y gate (R1)</text>
    <text x="116" y="503" fill="#a99a7e" font-size="13">CI ✓ green at the repo root — run the screen-reader/keyboard spike · goldens + E2E</text>
    <rect x="700" y="466" width="156" height="22" rx="11" fill="#241f16" stroke="#3a3322"/>
    <text x="778" y="481" fill="#ffd591" font-size="11" text-anchor="middle">needs human AT pass</text>

    <!-- M4 -->
    <circle cx="64" cy="562" r="7" fill="#4db0ff"/>
    <rect x="92" y="536" width="784" height="64" rx="14" fill="#16202f"/>
    <rect x="92" y="536" width="4" height="64" rx="2" fill="#4db0ff"/>
    <text x="116" y="566" fill="#4db0ff" font-size="17" font-weight="700">M4 · Native superpowers</text>
    <text x="116" y="587" fill="#8aa0bb" font-size="13">Offline-sync · push (FCM/APNs) · camera + biometric</text>
    <rect x="736" y="550" width="120" height="22" rx="11" fill="#101826" stroke="#243044"/>
    <text x="796" y="565" fill="#bcd6f5" font-size="11" text-anchor="middle">~2–3 wk</text>

    <!-- M5 -->
    <circle cx="64" cy="646" r="7" fill="#4db0ff"/>
    <rect x="92" y="620" width="784" height="64" rx="14" fill="#16202f"/>
    <rect x="92" y="620" width="4" height="64" rx="2" fill="#4db0ff"/>
    <text x="116" y="650" fill="#4db0ff" font-size="17" font-weight="700">M5 · Integrations + analytics</text>
    <text x="116" y="671" fill="#8aa0bb" font-size="13">Calendar · CSV/ICS/PDF + mail · onboarding · reports · i18n</text>
    <rect x="736" y="634" width="120" height="22" rx="11" fill="#101826" stroke="#243044"/>
    <text x="796" y="649" fill="#bcd6f5" font-size="11" text-anchor="middle">~2–3 wk</text>

    <!-- M6 -->
    <circle cx="64" cy="730" r="7" fill="#4db0ff"/>
    <rect x="92" y="704" width="784" height="64" rx="14" fill="#16202f"/>
    <rect x="92" y="704" width="4" height="64" rx="2" fill="#4db0ff"/>
    <text x="116" y="734" fill="#4db0ff" font-size="17" font-weight="700">M6 · Release readiness</text>
    <text x="116" y="755" fill="#8aa0bb" font-size="13">VPAT · store compliance · per-platform release pipelines — then Phase 9 enterprise (SSO, export, lifecycle)</text>
    <rect x="736" y="718" width="120" height="22" rx="11" fill="#101826" stroke="#243044"/>
    <text x="796" y="733" fill="#bcd6f5" font-size="11" text-anchor="middle">~2 wk</text>
  </g>

  <!-- legend -->
  <g>
    <circle cx="52" cy="814" r="6" fill="#21d1aa"/>
    <text x="64" y="818" fill="#8aa0bb" font-size="12">Done / rolling now</text>
    <circle cx="204" cy="814" r="6" fill="#ffbe55"/>
    <text x="216" y="818" fill="#8aa0bb" font-size="12">Needs the owner (token / AT pass)</text>
    <circle cx="444" cy="814" r="6" fill="#4db0ff"/>
    <text x="456" y="818" fill="#8aa0bb" font-size="12">Sequenced after the core</text>
  </g>
</svg>
