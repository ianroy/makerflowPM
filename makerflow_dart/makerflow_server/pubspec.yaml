name: makerflow_server
description: MakerFlow PM — Serverpod backend (Dart rebuild).
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

# (see ../FLUTTER_REBUILD_PLAN.md risk R6) and run `serverpod generate` after edits.
# Serverpod packages pinned to the exact CLI version (3.4.10) — ranges can
# mismatch the CLI (the generator warns about this).
dependencies:
  serverpod: 3.4.10
  serverpod_auth_server: 3.4.10
  crypto: ^3.0.0
  makerflow_client:
    path: ../makerflow_client

dev_dependencies:
  serverpod_test: 3.4.10
  lints: ^4.0.0
  test: ^1.25.0
