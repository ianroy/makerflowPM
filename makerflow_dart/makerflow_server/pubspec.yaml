name: makerflow_server
description: MakerFlow PM — Serverpod backend (Dart rebuild).
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

# Versions are illustrative. Pin to your installed Serverpod major in Phase 0
# (see ../FLUTTER_REBUILD_PLAN.md risk R6) and run `serverpod generate` after edits.
dependencies:
  serverpod: ^2.1.0
  serverpod_auth_server: ^2.1.0
  crypto: ^3.0.0
  makerflow_client:
    path: ../makerflow_client

dev_dependencies:
  serverpod_test: ^2.1.0
  lints: ^4.0.0
  test: ^1.25.0
