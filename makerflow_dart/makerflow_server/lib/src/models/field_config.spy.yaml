### Per-org custom field definition applied to an entity type.
class: FieldConfig
table: field_config
fields:
  organizationId: int, relation(parent=organization)
  entityType: String
  key: String
  label: String
  fieldType: String         # FieldConfigEndpoint.allowedFieldTypes (tier-1 set)
  optionsJson: String?       # select/multiSelect/label: JSON array of "value"
                             # or {"value": ..., "color": "#RRGGBB"} entries
  required: bool, default=false
  sortOrder: double, default=0
  createdAt: DateTime
  updatedAt: DateTime
indexes:
  field_config_unique_idx:
    fields: organizationId, entityType, key
    unique: true
