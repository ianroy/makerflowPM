# Serverpod code-generation config. Without this file the database feature
# defaults OFF (missingFileDefault: false) — which is why models with `table:`
# failed to generate. Its presence enables `database: true`.
type: server

client_package_path: ../makerflow_client

# Regenerate the serverpod_test harness (withServerpod/TestEndpoints) into this
# path. WITHOUT this key, `serverpod generate` skips the test tools entirely —
# leaving a stale file that froze `isDatabaseEnabled: false` and only the
# endpoints that existed when it was last written.
server_test_tools_path: test/integration/test_tools

features:
  database: true
