# Copy to passwords.yaml (gitignored) and fill in. DEV values mirror docker-compose.yaml.
# Maps the legacy MAKERSPACE_* secret contract onto Serverpod config keys.
development:
  database: 'makerflow_dev_password'
  redis: 'makerflow_dev_redis'
  serviceSecret: 'dev-service-secret-change-me'

production:
  database: 'REPLACE_WITH_MANAGED_PG_PASSWORD'   # was MAKERSPACE_DATABASE_URL password
  redis: 'REPLACE_WITH_REDIS_PASSWORD'
  serviceSecret: 'REPLACE_WITH_64_CHAR_SECRET'   # was MAKERSPACE_SECRET_KEY

# Used by the serverpod_test integration suite (config/test.yaml -> makerflow_test
# on the same :8090 Postgres; redis is disabled in test mode so no key needed).
test:
  database: 'makerflow_dev_password'
  serviceSecret: 'test-service-secret-change-me'
