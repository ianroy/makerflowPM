# CI for the Dart rebuild monorepo. Runs analyze + tests; builds web + Android.
# (This workflow lives under makerflow_dart/; if you keep the rebuild in the
# same repo, move it to the repo-root .github/workflows/ so Actions picks it up.)
name: dart-ci

on:
  pull_request:
    paths:
      - "makerflow_dart/**"
  push:
    branches: [main]
    paths:
      - "makerflow_dart/**"

defaults:
  run:
    working-directory: makerflow_dart

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: makerflow
          POSTGRES_PASSWORD: makerflow_dev_password
        ports: ["8090:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["8091:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: dart pub global activate melos
      - run: melos bootstrap
      # Codegen must run before analyze (it produces makerflow_client + ORM):
      - run: dart pub global activate serverpod_cli
      - run: cd makerflow_server && serverpod generate
      - run: melos run analyze
      - run: melos run analyze:flutter
      - run: melos run test
      - run: cd makerflow_flutter && flutter test

  build-web-android:
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: dart pub global activate melos && melos bootstrap
      - run: cd makerflow_flutter && flutter build web
      - run: cd makerflow_flutter && flutter build apk --debug
