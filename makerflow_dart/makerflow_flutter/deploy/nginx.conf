# Serves the Flutter web bundle (SPA): unknown paths fall back to index.html
# so go_router deep links (/tasks, /projects, ...) work on hard reload.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Build assets are content-hashed by Flutter; cache them for a day.
  location ~* \.(js|wasm|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|otf)$ {
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }
}
