name: makerflow_flutter
description: MakerFlow PM — Flutter client (web, iOS, Android, macOS, Windows, Linux).
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.0
  go_router: ^14.0.0
  makerflow_design:
    path: ../makerflow_design
  # Generated client + Serverpod Flutter integration (verified working).
  makerflow_client:
    path: ../makerflow_client
  serverpod_flutter: 3.4.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Bundle Avenir Next here (fonts/) to match the legacy typography.
  # fonts:
