name: makerflow_design
description: MakerFlow PM design system — Vibe-derived (monday.com-style) tokens, ThemeData, shared widgets.
publish_to: none
version: 0.2.0

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  # Figtree (body) + Poppins (titles) — monday.com's brand fonts, both SIL OFL
  # (licenses bundled in fonts/). Consumers reference them via the
  # `packages/makerflow_design/<family>` form (see MndFonts).
  fonts:
    - family: Figtree
      fonts:
        - asset: fonts/Figtree-Regular.ttf
        - asset: fonts/Figtree-Medium.ttf
          weight: 500
        - asset: fonts/Figtree-SemiBold.ttf
          weight: 600
        - asset: fonts/Figtree-Bold.ttf
          weight: 700
    - family: Poppins
      fonts:
        - asset: fonts/Poppins-Medium.ttf
          weight: 500
        - asset: fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: fonts/Poppins-Bold.ttf
          weight: 700
